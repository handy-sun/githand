[project]
name = "githand"
version = "0.1.0"
description = "Git workspace sync & migration tool — scan, status, snapshot, restore"
readme = "README.md"
authors = [
    { name = "sooncheer", email = "handy-sun@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
githand = "githand.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["githand*"]
